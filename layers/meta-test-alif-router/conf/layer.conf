# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-test-alif-router"
BBFILE_PATTERN_meta-test-alif-router = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-test-alif-router = "6"

LAYERDEPENDS_meta-test-alif-router = "core"
LAYERSERIES_COMPAT_meta-test-alif-router = "warrior zeus"
